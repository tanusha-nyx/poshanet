<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoshanNet — AI Child Growth Monitor</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f0f4f9;
            color: #1e293b;
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .hero-banner {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: white;
            padding: 40px 0 80px 0;
            border-radius: 0 0 24px 24px;
        }
        .main-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            margin-top: -50px;
            padding: 40px;
            border: 1px solid #e2e8f0;
        }
        .form-label {
            font-weight: 600;
            font-size: 0.875rem;
            color: #475569;
        }
        .input-group-text {
            background-color: #f8fafc;
            border-color: #cbd5e1;
            color: #64748b;
        }
        .form-control, .form-select {
            border-color: #cbd5e1;
            padding: 0.75rem 1rem;
            border-radius: 10px;
        }
        .form-control:focus, .form-select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }
        .btn-analyze {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-weight: 700;
            font-size: 1.05rem;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            transition: all 0.2s ease;
        }
        .btn-analyze:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
        }
    </style>
</head>
<body>

<div class="hero-banner">
    <div class="container text-center">
        <span class="badge bg-blue-500 text-uppercase mb-2 px-3 py-2" style="background: rgba(255,255,255,0.15); border-radius: 30px;">
            <i class="fa-solid fa-brain me-1"></i> Federated AI Diagnostics
        </span>
        <h1 class="fw-bold display-5 mb-2">PoshanNet Diagnostics</h1>
        <p class="text-white-50 max-w-xl mx-auto">Non-invasive, fast, and clinically guided anthropometric child malnutrition assessment portal.</p>
    </div>
</div>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="main-card">
                <form action="/predict" method="POST">
                    <div class="d-flex align-items-center mb-4 pb-2 border-bottom">
                        <i class="fa-solid fa-child-reaching text-primary fs-4 me-3"></i>
                        <h5 class="fw-bold m-0">Anthropometric Data Input</h5>
                    </div>

                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label">Age (Months)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-calendar-days"></i></span>
                                <input type="number" step="0.1" name="age" class="form-control" placeholder="e.g. 24" required>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Gender</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-venus-mars"></i></span>
                                <select name="sex" class="form-select" required>
                                    <option value="1">Male</option>
                                    <option value="0">Female</option>
                                </select>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Height (cm)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-ruler-vertical"></i></span>
                                <input type="number" step="0.1" name="height" class="form-control" placeholder="e.g. 85.0" required>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Weight (kg)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-weight-scale"></i></span>
                                <input type="number" step="0.1" name="weight" class="form-control" placeholder="e.g. 11.5" required>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">MUAC (Mid-Upper Arm Circ. cm)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-tape"></i></span>
                                <input type="number" step="0.1" name="muac" class="form-control" placeholder="e.g. 13.0" required>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Head Circumference (cm)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-circle-notch"></i></span>
                                <input type="number" step="0.1" name="head_circ" class="form-control" placeholder="e.g. 46.5" required>
                            </div>
                        </div>
                    </div>

                    <div class="mt-5">
                        <button type="submit" class="btn btn-primary btn-analyze w-100 text-white">
                            <i class="fa-solid fa-microscope me-2"></i> Run PoshanNet Evaluation
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
